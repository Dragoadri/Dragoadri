<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="900" height="16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-200%" y="-400%" width="500%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="7" width="900" height="1.5" fill="url(#dg)"/>
  <g filter="url(#dglow)">
    <circle cy="7.75" r="3.5" fill="#ffffff">
      <animate attributeName="cx" values="-20;920" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <rect y="6.5" height="2.5" width="90" fill="#00ff41" opacity="0.5">
      <animate attributeName="x" values="-110;910" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
